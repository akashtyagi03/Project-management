services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-deploying}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/project_management}
      UPLOADS_DIR: /app/uploads
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      - mongo
    volumes:
      - groundwork-uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
  groundwork-uploads:
